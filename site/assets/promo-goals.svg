<svg xmlns="http://www.w3.org/2000/svg" width="420" height="620" viewBox="0 0 420 620" role="img" aria-labelledby="title desc"><title id="title">Копите на важное</title><desc id="desc">Промо-иллюстрация прогресса финансовых целей</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#7763BC"/><stop offset="1" stop-color="#342852"/></linearGradient></defs><rect width="420" height="620" rx="28" fill="url(#bg)"/><g font-family="system-ui,-apple-system,sans-serif"><text x="27" y="37" font-size="15" font-weight="800" fill="#E8E2FC">ТРАЧУ.</text><text x="27" y="88" font-size="34" font-weight="800" letter-spacing="-1" fill="white">Копите</text><text x="27" y="128" font-size="34" font-weight="800" letter-spacing="-1" fill="white">на важное</text><text x="27" y="155" font-size="15" fill="#E8E2FC">Каждое пополнение приближает цель</text><rect x="78" y="180" width="264" height="442" rx="33" fill="#171526"/><rect x="84" y="186" width="252" height="430" rx="27" fill="#F5F4F8"/><rect x="184" y="195" width="52" height="6" rx="3" fill="#88839a"/><text x="100" y="231" font-size="19" font-weight="750" fill="#27243E">Цели</text><rect x="100" y="247" width="220" height="145" rx="18" fill="white"/><text x="114" y="275" font-size="16" font-weight="750" fill="#27243E">Отпуск</text><text x="114" y="302" font-size="23" font-weight="800" fill="#422B99">24 000 ₽</text><text x="114" y="322" font-size="12" fill="#5F5A72">из 40 000 ₽</text><rect x="114" y="334" width="192" height="8" rx="4" fill="#E8E2FC"/><rect x="114" y="334" width="115.2" height="8" rx="4" fill="#6143CC"/><rect x="114" y="352" width="192" height="28" rx="10" fill="#DDF4E5"/><text x="210" y="370" font-size="12" text-anchor="middle" font-weight="700" fill="#145C37">+ Пополнить</text><rect x="100" y="404" width="220" height="145" rx="18" fill="white"/><text x="114" y="432" font-size="15" font-weight="750" fill="#27243E">Финансовая подушка</text><text x="114" y="459" font-size="23" font-weight="800" fill="#422B99">45 000 ₽</text><text x="114" y="479" font-size="12" fill="#5F5A72">из 100 000 ₽</text><rect x="114" y="491" width="192" height="8" rx="4" fill="#E8E2FC"/><rect x="114" y="491" width="86.4" height="8" rx="4" fill="#6143CC"/><rect x="114" y="509" width="192" height="28" rx="10" fill="#DDF4E5"/><text x="210" y="527" font-size="12" text-anchor="middle" font-weight="700" fill="#145C37">+ Пополнить</text></g></svg>
