name: Android verification
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: trachu-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_trachuAdsEnabled: ${{ vars.TRACHU_ADS_ENABLED || 'true' }}
      ORG_GRADLE_PROJECT_trachuBannerId: ${{ vars.TRACHU_BANNER_ID || 'R-M-20514950-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-36/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            manager="$(command -v sdkmanager || true)"
            if [[ -z "$manager" ]]; then manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"; fi
            test -x "$manager"
            "$manager" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;35.0.0'
          fi
      - name: Compile application and run unit tests and lint
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lintDebug lintRelease
      - name: Check APK permissions and advertising configuration
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -s "$apk"
            "$tools/aapt" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
            if grep -E 'permission\.(AD_ID|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|READ_SMS|RECORD_AUDIO)' "$RUNNER_TEMP/permissions.txt"; then exit 1; fi
            "$tools/zipalign" -c -P 16 4 "$apk"
          done
          "$tools/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          debug_config="$(find app/build/generated/source/buildConfig/debug -name BuildConfig.java -print -quit)"
          release_config="$(find app/build/generated/source/buildConfig/release -name BuildConfig.java -print -quit)"
          grep -F 'YANDEX_BANNER_ID = "demo-banner-yandex";' "$debug_config"
          if [[ "${ORG_GRADLE_PROJECT_trachuAdsEnabled:-false}" == "true" ]]; then
            [[ "${ORG_GRADLE_PROJECT_trachuBannerId:-}" =~ ^R-M-[0-9]+-[0-9]+$ ]]
            grep -F "YANDEX_BANNER_ID = \"${ORG_GRADLE_PROJECT_trachuBannerId}\";" "$release_config"
          else
            grep -F 'YANDEX_BANNER_ID = "";' "$release_config"
          fi
      - name: Build historical APKs for migration checks
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/trachu-v1"
          baseline11="$RUNNER_TEMP/trachu-v11"
          git worktree add --detach "$baseline" 55a0d207e709d6319426772c1bd46d70943b1062
          git worktree add --detach "$baseline11" 7e75bea159803e06d7473d8c4203e72f0b823bea
          gradle --project-dir "$baseline" --no-daemon assembleDebug
          gradle --project-dir "$baseline11" --no-daemon assembleDebug
          echo "TRACHU_UPGRADE_BASELINE_APK=$baseline/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          echo "TRACHU_UPGRADE_V11_APK=$baseline11/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 phone and tablet, installation, migrations and offline use
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - name: Android 8 compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh api26
      - name: Android 13 compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh api33
      - name: Deliver tested APK
        uses: actions/upload-artifact@v4
        with:
          name: trachu-1.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
