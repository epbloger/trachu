name: Release build
on:
  workflow_dispatch:
  push:
    branches: [main, 'dev/1.2.0-finalization']
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/scripts/device-tests.sh'
      - '.github/scripts/offline-smoke.py'
      - '.github/scripts/upgrade-smoke.py'
      - '.github/scripts/notification-smoke.py'
      - 'store/rustore/sign-release.ps1'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/scripts/device-tests.sh'
      - '.github/scripts/offline-smoke.py'
      - '.github/scripts/upgrade-smoke.py'
      - '.github/scripts/notification-smoke.py'
      - 'store/rustore/sign-release.ps1'

permissions:
  contents: read
concurrency:
  # Keep each source revision isolated; never cancel a build for another revision.
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ORG_GRADLE_PROJECT_trachuAdsEnabled: ${{ vars.TRACHU_ADS_ENABLED || 'true' }}
      ORG_GRADLE_PROJECT_trachuBannerId: ${{ vars.TRACHU_BANNER_ID || 'R-M-20514950-1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-36/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            manager="$(command -v sdkmanager || true)"
            if [[ -z "$manager" ]]; then manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"; fi
            test -x "$manager"
            "$manager" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-36/android.jar"
      - name: Build application variants
        id: build
        run: gradle --no-daemon --continue --stacktrace assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest
      - name: Check package metadata
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          git rev-parse HEAD > qa/source-commit.txt
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/*.apk | tee qa/apk-permissions.txt
          if grep -E 'permission\.(AD_ID|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|READ_SMS|RECORD_AUDIO)' qa/apk-permissions.txt; then
            echo "::error::Unexpected advertising identifier or sensitive Android permission"
            exit 1
          fi
          "$AAPT" dump badging app/build/outputs/apk/debug/*.apk > qa/apk-badging.txt
          "$AAPT" dump badging app/build/outputs/apk/release/*.apk > qa/release-apk-badging.txt
          "$AAPT" dump permissions app/build/outputs/apk/release/*.apk > qa/release-apk-permissions.txt
          if grep -E 'permission\.(AD_ID|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|READ_SMS|RECORD_AUDIO)' qa/release-apk-permissions.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/*.apk > qa/apk-signature.txt
          grep -F 'CN=Android Debug' qa/apk-signature.txt
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/*.apk > qa/release-apk-unsigned.txt 2>&1; then
            echo "::error::Expected an unsigned release APK"
            exit 1
          fi
          grep -F 'DOES NOT VERIFY' qa/release-apk-unsigned.txt
          jarsigner -verify app/build/outputs/bundle/release/*.aab > qa/release-aab-unsigned.txt
          grep -F 'jar is unsigned.' qa/release-aab-unsigned.txt
          release_manifest="$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)"
          test -n "$release_manifest"
          cp "$release_manifest" qa/release-manifest.xml
          if grep -E 'android:name="[^"]*permission\.(AD_ID|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|READ_CONTACTS|READ_SMS|RECORD_AUDIO)"' "$release_manifest"; then
            echo "::error::Unexpected sensitive permission in release manifest"
            exit 1
          fi
          debug_config="$(find app/build/generated/source/buildConfig/debug -name BuildConfig.java -print -quit)"
          release_config="$(find app/build/generated/source/buildConfig/release -name BuildConfig.java -print -quit)"
          test -n "$debug_config" && test -n "$release_config"
          grep -Eq 'YANDEX_BANNER_ID = "demo-banner-yandex";' "$debug_config"
          if [[ "$ORG_GRADLE_PROJECT_trachuAdsEnabled" == true ]]; then
            grep -Eq 'YANDEX_BANNER_ID = "R-M-[0-9]+-[0-9]+";' "$release_config"
            printf 'Debug: official demo only\nRelease: explicitly enabled production placement; ownership requires publisher verification\n' > qa/ads-config.txt
          else
            grep -Eq 'YANDEX_BANNER_ID = "";' "$release_config"
            printf 'Debug: official demo only\nRelease: disabled, empty placement\n' > qa/ads-config.txt
          fi
      - name: Code checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: gradle --no-daemon --continue --stacktrace testDebugUnitTest lintDebug lintRelease
      - name: Upgrade compatibility
        id: baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provenance.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/trachu-v1"
          git worktree add --detach "$baseline" 55a0d207e709d6319426772c1bd46d70943b1062
          gradle --project-dir "$baseline" --no-daemon assembleDebug
          old="$baseline/app/build/outputs/apk/debug/app-debug.apk"
          new="app/build/outputs/apk/debug/app-debug.apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs "$old" > qa/upgrade-baseline-cert.txt
          "$signer" verify --print-certs "$new" > qa/upgrade-current-cert.txt
          diff <(grep 'certificate SHA-256 digest:' qa/upgrade-baseline-cert.txt) <(grep 'certificate SHA-256 digest:' qa/upgrade-current-cert.txt)
          echo "TRACHU_UPGRADE_BASELINE_APK=$old" >> "$GITHUB_ENV"
          git -C "$baseline" rev-parse HEAD > qa/upgrade-baseline-commit.txt
          sha256sum "$old" > qa/upgrade-baseline-sha256.txt
          baseline11="$RUNNER_TEMP/trachu-v11"
          git worktree add --detach "$baseline11" 7e75bea159803e06d7473d8c4203e72f0b823bea
          gradle --project-dir "$baseline11" --no-daemon assembleDebug
          old11="$baseline11/app/build/outputs/apk/debug/app-debug.apk"
          "$signer" verify --print-certs "$old11" > qa/upgrade-v11-baseline-cert.txt
          diff <(grep 'certificate SHA-256 digest:' qa/upgrade-v11-baseline-cert.txt) <(grep 'certificate SHA-256 digest:' qa/upgrade-current-cert.txt)
          echo "TRACHU_UPGRADE_V11_APK=$old11" >> "$GITHUB_ENV"
          git -C "$baseline11" rev-parse HEAD > qa/upgrade-v11-baseline-commit.txt
          sha256sum "$old11" > qa/upgrade-v11-baseline-sha256.txt
      - name: Prepare emulator
        id: kvm
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provenance.outcome == 'success' && steps.baseline.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device compatibility
        if: ${{ !cancelled() && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - name: Legacy Android compatibility
        if: ${{ !cancelled() && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh api26
      - name: Android 13 compatibility
        if: ${{ !cancelled() && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/device-tests.sh api33
      - name: Validate release packages
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -n "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > qa/release-apk-badging.txt
          grep -F "package: name='ru.epbloger.trachu' versionCode='3' versionName='1.2.0'" qa/release-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$APK" | tee qa/zipalign.txt
          sha256sum "$APK" "$AAB" > qa/SHA256SUMS
          sha256sum -c qa/SHA256SUMS
          python3 - "$APK" "$AAB" <<'PY'
          import struct
          import sys
          import zipfile

          PAGE = 16 * 1024

          def verify(path):
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, f"{path}: ZIP CRC mismatch"
                  libraries = [entry for entry in archive.infolist() if entry.filename.endswith(".so")]
                  assert libraries, f"{path}: no native libraries"
                  for entry in libraries:
                      data = archive.read(entry)
                      assert data[:4] == b"\x7fELF", f"{entry.filename}: invalid ELF"
                      elf_class, encoding = data[4], data[5]
                      assert elf_class in (1, 2) and encoding in (1, 2), f"{entry.filename}: invalid ELF header"
                      endian = "<" if encoding == 1 else ">"
                      if elf_class == 2:
                          phoff = struct.unpack_from(endian + "Q", data, 32)[0]
                          entsize, count = struct.unpack_from(endian + "HH", data, 54)
                          minimum, off_pos, align_pos, word = 56, 8, 48, "Q"
                      else:
                          phoff = struct.unpack_from(endian + "I", data, 28)[0]
                          entsize, count = struct.unpack_from(endian + "HH", data, 42)
                          minimum, off_pos, align_pos, word = 32, 4, 28, "I"
                      assert entsize >= minimum and phoff + entsize * count <= len(data), f"{entry.filename}: invalid program headers"
                      loads = 0
                      for index in range(count):
                          pos = phoff + index * entsize
                          if struct.unpack_from(endian + "I", data, pos)[0] != 1:
                              continue
                          loads += 1
                          off, address = struct.unpack_from(endian + ("QQ" if elf_class == 2 else "II"), data, pos + off_pos)
                          alignment = struct.unpack_from(endian + word, data, pos + align_pos)[0]
                          assert alignment >= PAGE and alignment & (alignment - 1) == 0 and off % PAGE == address % PAGE, f"{entry.filename}: incompatible LOAD alignment {alignment}"
                      assert loads > 0, f"{entry.filename}: no LOAD segments"
              print(f"PASS {path}: native ELF LOAD segments use 16-KiB alignment")

          for candidate in sys.argv[1:]:
              verify(candidate)
          PY
      - name: Validate release provenance
        shell: pwsh
        run: |
          $sha=(git rev-parse HEAD).Trim()
          & ./store/rustore/sign-release.ps1 -ArtifactDir . -ExpectedCommit $sha -VerifyOnly 6>&1 | Tee-Object -FilePath qa/signing-verify-only.txt
      - name: Upload unsigned Release files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trachu-release-unsigned-v1.2.0
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            qa/source-commit.txt
            qa/SHA256SUMS
            qa/signing-verify-only.txt
            qa/zipalign.txt
          if-no-files-found: error
          retention-days: 7
