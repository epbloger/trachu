name: RuStore screenshots 1.2.0
on:
  push:
    branches: ['store-media-1.2.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trachu-store-media
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_trachuAdsEnabled: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-36/android.jar" || ! -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            manager="$(command -v sdkmanager || true)"
            if [[ -z "$manager" ]]; then manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"; fi
            "$manager" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;35.0.0'
          fi
      - name: Build unchanged application and screenshot test APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual phone and tablet application screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/store-media.sh
      - name: Upload real screenshots
        uses: actions/upload-artifact@v4
        with:
          name: trachu-1.2.0-store-screenshots
          path: store-media/
          if-no-files-found: error
          retention-days: 30
